name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure shared APK signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_KEYSTORE_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" || -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "Configure all four Android signing repository secrets before running this workflow."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/tusur-schedule-shared-signing.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "TUSUR_SIGNING_KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "TUSUR_SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "TUSUR_SIGNING_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "TUSUR_SIGNING_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Shared signing key configured."

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug and optimized release APKs
        run: gradle assembleDebug assembleRelease

      - name: Upload debug and release APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TUSUR-Schedule-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/tusur-schedule.apk"

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APK_PATH="$RUNNER_TEMP/tusur-schedule.apk"
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          printf 'Расписание ТУСУР %s\n\nПриложение для просмотра актуального расписания занятий ТУСУР.\n\nAPK-файл этой версии доступен для установки на устройства Android.\n\nversionCode: %s\n' \
            "$VERSION_NAME" "$VERSION_CODE" > release-notes-generated.md

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Расписание ТУСУР $VERSION_NAME" \
              --notes-file release-notes-generated.md
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
              --title "Расписание ТУСУР $VERSION_NAME" \
              --notes-file release-notes-generated.md
          fi
